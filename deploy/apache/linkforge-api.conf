# ---------------------------------------------------------------------------
# API + dashboard vhost.
#
# Serves the built React SPA from dashboard/dist and the Laravel API from the
# same origin, so the browser makes no cross-origin calls and no CORS
# configuration is required.
#
# Deployed to /etc/httpd/conf.d/linkforge-api.conf on Amazon Linux 2023.
# ---------------------------------------------------------------------------

<VirtualHost *:443>
    ServerName api.linkforge.example

    DocumentRoot /var/www/linkforge/public

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/api.linkforge.example.crt
    SSLCertificateKeyFile /etc/pki/tls/private/api.linkforge.example.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/linkforge/public>
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/linkforge.sock|fcgi://localhost/"
    </FilesMatch>

    # Built SPA. Vite emits content-hashed asset filenames, so assets are
    # immutable while index.html must never be cached.
    Alias /dashboard /var/www/linkforge/dashboard/dist

    <Directory /var/www/linkforge/dashboard/dist>
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ /dashboard/index.html [L]

        <FilesMatch "\.(js|css|woff2|svg|png)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>

        <Files "index.html">
            Header set Cache-Control "no-cache"
        </Files>
    </Directory>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
    </IfModule>

    KeepAlive On
    KeepAliveTimeout 5

    # Analytics queries over long ranges can take a moment; the redirect vhost's
    # 15s timeout would be too tight here.
    Timeout 60

    CustomLog /var/log/httpd/linkforge-api.log combined
    ErrorLog /var/log/httpd/linkforge-api-error.log

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>

<VirtualHost *:80>
    ServerName api.linkforge.example
    Redirect permanent / https://api.linkforge.example/
</VirtualHost>
