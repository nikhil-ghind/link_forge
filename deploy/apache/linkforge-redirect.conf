# ---------------------------------------------------------------------------
# Redirect vhost — the short domain.
#
# This vhost serves nothing but /{slug}. It is deliberately separate from the
# API/dashboard vhost so the hot path can be tuned (keepalive, logging, TLS
# session reuse) without those settings affecting the management surface, and
# so a flood of redirect traffic cannot starve the API of workers.
#
# Deployed to /etc/httpd/conf.d/linkforge-redirect.conf on Amazon Linux 2023.
# ---------------------------------------------------------------------------

<VirtualHost *:443>
    ServerName lnkf.rg

    DocumentRoot /var/www/linkforge/public

    SSLEngine on
    SSLCertificateFile /etc/pki/tls/certs/lnkf.rg.crt
    SSLCertificateKeyFile /etc/pki/tls/private/lnkf.rg.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    <Directory /var/www/linkforge/public>
        AllowOverride None
        Require all granted

        # AllowOverride is off, so the rewrite rules live here rather than in
        # .htaccess — Apache then never stats for .htaccess on every request.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    # Route PHP to php-fpm over a unix socket. mod_php would work, but fpm's
    # separate process pool means a slow request cannot occupy an httpd worker.
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/linkforge.sock|fcgi://localhost/"
    </FilesMatch>

    # Redirect clients almost always issue exactly one request, then follow the
    # 302 elsewhere. A long keepalive just holds workers open for nothing.
    KeepAlive On
    KeepAliveTimeout 2
    MaxKeepAliveRequests 100

    Timeout 15

    # The redirect path is the p99 that matters, so log its latency in
    # microseconds (%D) and whether the slug resolved.
    LogFormat "%h %t \"%r\" %>s %D %{X-LinkForge-Slug}o \"%{Referer}i\" \"%{User-Agent}i\"" redirect
    CustomLog /var/log/httpd/linkforge-redirect.log redirect
    ErrorLog /var/log/httpd/linkforge-redirect-error.log

    # The management API is not reachable from the short domain at all.
    RedirectMatch 404 ^/api(/|$)
    RedirectMatch 404 ^/dashboard(/|$)

    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>

<VirtualHost *:80>
    ServerName lnkf.rg
    Redirect permanent / https://lnkf.rg/
</VirtualHost>
